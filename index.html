<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprout: bills</title>
<meta name="description" content="A budget game for ADHD brains. Bills are characters: ignore them and they fade, glitch, and charge late fees.">
<meta name="theme-color" content="#dce8d0">
<meta property="og:title" content="Sprout: bills">
<meta property="og:description" content="Treat your bills like a dating sim. Pay attention or they drift away.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌱%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="fog"></div>
<div class="card">
  <div class="hero" id="hero"></div>
  <div class="bubble" id="bubble" role="status" aria-live="polite"></div>
  <div class="stats">
    <div class="pill-stat" id="bal"></div>
    <div class="pill-stat" id="day"></div>
    <div class="pill-stat" id="streak"></div>
  </div>
  <div class="att" id="att"></div>
  <div id="list"></div>
  <div class="foot"><button type="button" class="pill go" id="next">Next day ▶</button><button type="button" class="pill" id="reset">Start over</button></div>
  <div class="note">Tap the big face to spend time on it. Bills fade daily. Payday comes every 7 days.</div>
</div>
<script src="script.js" defer></script>
</body>
</html>
